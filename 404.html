<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Страница не найдена — Я-Зарядка AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: linear-gradient(135deg, #c9f6d8, #dff7ff); min-height: 100vh; display: grid; place-items: center; padding: 20px; }
    .container { text-align: center; max-width: 500px; }
    h1 { font-size: 120px; color: #27b66b; line-height: 1; margin-bottom: 20px; }
    h2 { font-size: 28px; color: #19372d; margin-bottom: 15px; }
    p { color: #5b786d; line-height: 1.6; margin-bottom: 30px; }
    a { display: inline-block; background: #27b66b; color: #fff; padding: 15px 30px; border-radius: 16px; font-weight: 900; text-decoration: none; transition: 0.2s; }
    a:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(39,182,107,0.3); }
    .emoji { font-size: 80px; margin-bottom: 20px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="emoji">🤖</div>
    <h1>404</h1>
    <h2>Упс! Страница не найдена</h2>
    <p>Похоже, вы заблудились. Не проблема — вернитесь на главную и продолжите зарядку!</p>
    <a href="/">← На главную</a>
  </div>
</body>
</html>
