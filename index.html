<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#bff2d0">
<title>Я-Зарядка AI — детский мир движения</title>
<style>
html,body{margin:0;min-height:100%;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#f7fff9;color:#19372d}.loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}.loading-card{max-width:520px;background:#fff;border-radius:28px;padding:32px;box-shadow:0 22px 60px rgba(31,105,73,.14)}.loading-mark{font-size:42px;margin-bottom:10px}.loading h1{font-size:28px;margin:0 0 8px}.loading p{margin:0;color:#527066}.loading small{display:block;margin-top:16px;color:#789187}
</style>
</head>
<body>
<div class="loading"><div class="loading-card"><div class="loading-mark">⚡</div><h1>Я-Зарядка AI</h1><p>Загружаем детский мир движения…</p><small>Подготавливаем страницу приложения.</small></div></div>
<script>
(async()=>{
  const source='https://raw.githubusercontent.com/paulafanasyev/ya-zaryadka-ai/60861c6134d1d4662990e838a9cbea0ecbb814a9/index.html';
  try{
    const response=await fetch(source,{cache:'no-store'});
    if(!response.ok) throw new Error('HTTP '+response.status);
    let html=await response.text();
    const styles=`<style id="app-screenshots-style">
      .app-screenshots{background:linear-gradient(180deg,#f7fff9 0%,#e8fbf0 100%);padding:92px 0}
      .app-screenshots .section-head{margin-bottom:38px}
      .app-shot-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;align-items:start}
      .app-shot{margin:0;background:#fff;border:8px solid #fff;border-radius:34px;overflow:hidden;box-shadow:0 22px 60px rgba(31,105,73,.14)}
      .app-shot img{display:block;width:100%;height:auto;background:#eef9f1}
      .app-shot figcaption{padding:18px 20px 20px;font-weight:900;color:#19372d}
      .app-shot figcaption small{display:block;margin-top:5px;font-weight:600;color:#668076}
      @media(max-width:950px){.app-shot-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
      @media(max-width:700px){.app-screenshots{padding:68px 0}.app-shot-grid{grid-template-columns:1fr}.app-shot{max-width:559px;margin:auto}}
    </style>`;
    const section=`<section class="app-screenshots" id="app-screenshots"><div class="container"><div class="section-head reveal"><h2>Скриншоты работы приложения</h2><p>Реальные экраны Я-Зарядка AI: меню, главный экран и начисление баллов за зарядку.</p></div><div class="app-shot-grid">
      <figure class="app-shot reveal"><img src="assets/screenshots/app-menu-settings.svg" alt="Скриншот приложения Я-Зарядка AI: меню и раздел Настройки" loading="lazy"><figcaption>Меню приложения <small>Баланс · Профиль · Информация · Настройки · Поделиться · QR-код · Поддержка · О приложении</small></figcaption></figure>
      <figure class="app-shot reveal"><img src="assets/screenshots/app-home-reward.svg" alt="Скриншот приложения Я-Зарядка AI: главный экран и награды" loading="lazy"><figcaption>Главный экран и награды <small>Копилка сердец и молний · вознаграждение · ролики · добрые дела</small></figcaption></figure>
      <figure class="app-shot reveal"><img src="assets/screenshots/app-points-reward.svg" alt="Скриншот приложения Я-Зарядка AI: баллы за зарядку" loading="lazy"><figcaption>Баллы за зарядку <small>Начисление Сердец и Молний и выбор вознаграждения</small></figcaption></figure>
    </div></div></section>`;
    html=html.replace('</head>',styles+'</head>').replace('</main>',section+'</main>');
    document.open();document.write(html);document.close();
  }catch(error){
    document.body.innerHTML='<div class="loading"><div class="loading-card"><div class="loading-mark">⚡</div><h1>Я-Зарядка AI</h1><p>Не удалось загрузить основную страницу.</p><small>Проверьте соединение и обновите страницу.</small></div></div>';
    console.error(error);
  }
})();
</script>
</body>
</html>
