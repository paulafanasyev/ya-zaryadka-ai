ercontent.com/paulafanasyev/ya-zaryadka-ai/piko-ai-voice/index.html';try{const response=await fetch(source,{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);let html=await response.text();const section='<section class="app-extra" id="app-screenshots"><div class="container"><h2>Пико и работа приложения</h2><p class="lead">Пико снова на месте — детский AI-помощник с голосовой озвучкой и состояниями Idle, Thinking, Speaking, Happy и Error.</p><div class="piko-card"><div class="piko-avatar">🤖</div><div><h3>Пико</h3><p>Помогает с зарядкой, полезными привычками, учёбой и творчеством. В мобильной версии Пико использует русский TTS и реагирует на состояние диалога.</p><span class="piko-badge">✓ Голос · ✓ AI · ✓ детский режим</span></div></div><div class="shots"><figure class="shot"><img src="https://paulafanasyev.github.io/ya-zaryadka-ai/assets/screenshots/app-menu-settings.svg" alt="Скриншот Я-Зарядка AI: меню и настройки"></figure><figure class="shot"><img src="https://paulafanasyev.github.io/ya-zaryadka-ai/assets/screenshots/app-home-reward.svg" alt="Скриншот Я-Зарядка AI: главный экран и награды"></figure><figure class="shot"><img src="https://paulafanasyev.github.io/ya-zaryadka-ai/assets/screenshots/app-points-reward.svg" alt="Скриншот Я-Зарядка AI: баллы и награда"></figure></div></div></section>';html=html.replace('</main>',section+'</main>');document.open();document.write(html);document.close()}catch(e){console.error(e);document.body.innerHTML='<div class="loading"><div class="loading-card"><h1>Я-Зарядка AI</h1><p>Не удалось загрузить страницу.</p></div></div>'}})();</script></body></html>
