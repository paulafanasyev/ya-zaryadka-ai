name: Header size fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reduce download button and align header
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='/* header-size-alignment-fix-v2 */'
          if marker not in s:
              css='''\n/* header-size-alignment-fix-v2 */\n.nav{height:68px;align-items:center;gap:14px}\n.logo{font-size:17px;line-height:1;gap:8px;align-items:center}\n.logo-mark{width:36px;height:36px;border-radius:11px;font-size:19px}\n.nav-links{gap:16px;font-size:13px;line-height:1;align-items:center}\n.nav-links a{display:flex;align-items:center;height:36px;line-height:1;white-space:nowrap}\n.nav-cta{display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 13px;border-radius:11px;font-size:13px;line-height:1;white-space:nowrap}\n@media(max-width:900px){.nav-links{gap:10px}.nav-cta{padding:0 11px;font-size:12px}.logo{font-size:16px}}\n@media(max-width:700px){.nav{height:64px}.logo{font-size:15px}.logo-mark{width:34px;height:34px;font-size:18px}.nav-cta{height:34px;padding:0 10px;font-size:12px}}\n'''
              s=s.replace('</style>',css+'</style>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and remove workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'style: reduce header download button' || true
          git rm .github/workflows/header-size-fix.yml || true
          git commit -m 'chore: remove temporary header workflow' || true
          git push
