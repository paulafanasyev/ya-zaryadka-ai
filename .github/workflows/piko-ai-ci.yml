name: Piko AI CI

on:
  push:
    branches: [piko-ai-voice]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/piko-ai-ci.yml'
  pull_request:
    branches: [app, piko-ai-voice]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/piko-ai-ci.yml'

jobs:
  test-and-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - run: npm ci
      - run: npm test -- --runInBand
      - run: npx tsc --noEmit
