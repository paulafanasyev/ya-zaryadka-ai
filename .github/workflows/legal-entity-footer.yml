name: Add legal entity to footer

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-footer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add legal entity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<div>© 2026 Я-Зарядка</div>'
          new = '<div>© 2026 Я-Зарядка<br><strong>Юридическое лицо: АНО ЦПС «Мир-Самозанятых»</strong></div>'
          if 'АНО ЦПС «Мир-Самозанятых»' not in s:
              if old not in s:
                  raise SystemExit('footer marker not found')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'chore: show legal entity in footer'
            git push
          fi
      - name: Remove one-shot workflow
        if: always()
        run: |
          rm -f .github/workflows/legal-entity-footer.yml
          git add .github/workflows/legal-entity-footer.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: remove one-shot footer workflow'
          git push