name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [apk-build]
    paths:
      - 'mobile-app/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Fetch Pico image
        run: |
          mkdir -p assets
          curl -fsSL -o assets/pico.png https://raw.githubusercontent.com/paulafanasyev/ya-zaryadka-ai/main/assets/robot/robot_3Dblue.png
          ls -la assets

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Align Expo SDK versions
        run: npx expo install --fix -- --legacy-peer-deps || npx expo install --fix

      - name: Expo prebuild (android)
        env:
          CI: 1
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK (signed with debug key)
        working-directory: mobile-app/android
        run: ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Rename APK
        run: |
          mkdir -p ../dist
          cp android/app/build/outputs/apk/release/app-release.apk ../dist/ya-zaryadka-ai-${{ github.run_number }}.apk
          ls -la ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: ya-zaryadka-ai-apk
          path: dist/*.apk

      - name: Publish test release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-test-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: "Я-Зарядка AI, тестовая сборка ${{ github.run_number }}"
          prerelease: true
          body: |
            Тестовая сборка Android (ветка apk-build, коммит ${{ github.sha }}).
            APK подписан отладочным ключом. При первом запуске зарядки нужен интернет для загрузки модели распознавания позы.
          files: dist/*.apk
