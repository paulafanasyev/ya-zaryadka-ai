name: Add legal links
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add links to footer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<a href="https://www.rustore.ru/catalog/app/app.vercel.yazaryadk" target="_blank" rel="noopener">RuStore</a>'
          new = old + '<a href="privacy.html">Политика конфиденциальности</a><a href="terms.html">Пользовательское соглашение</a>'
          if 'privacy.html' not in s:
              if old not in s:
                  raise SystemExit('RuStore footer link not found; refusing to modify index.html')
              s = s.replace(old, new, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Add privacy policy and user agreement links'
          git push
      - name: Remove one-shot workflow
        if: always()
        run: |
          rm -f .github/workflows/add-legal-links.yml
          git add -u .github/workflows/add-legal-links.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Remove one-shot legal links workflow'
          git push
