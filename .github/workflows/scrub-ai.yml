name: Scrub AI references

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  scrub:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove AI references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          replacements = {
              'Я-Зарядка AI': 'Я-Зарядка',
              'Светлана и AI': 'Светлана',
              'AI-помощник': 'Помощник',
              'AI-помощник': 'Помощник',
          }

          # Remove the Telegram link whose public handle itself contains AI.
          telegram = re.compile(r'<a href="https://t\.me/YaZaryadkaAI"[^>]*>Telegram</a>')

          text_ext = {'.html', '.md', '.txt', '.css', '.js', '.json', '.yml', '.yaml', '.xml', '.svg'}
          changed = []
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.suffix.lower() not in text_ext:
                  continue
              try:
                  s = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              original = s
              for a, b in replacements.items():
                  s = s.replace(a, b)
              s = telegram.sub('', s)
              # Remove standalone English AI tokens from human-facing text/content.
              s = re.sub(r'(?<![A-Za-z])AI(?![A-Za-z])', '', s)
              if s != original:
                  p.write_text(s, encoding='utf-8')
                  changed.append(str(p))

          if changed:
              print('Changed:', *changed, sep='\n- ')
          else:
              print('No file changes required')
          PY
      - name: Verify no AI text remains
        run: |
          if grep -RInE --exclude-dir=.git --include='*.html' --include='*.md' --include='*.txt' --include='*.css' --include='*.js' --include='*.json' --include='*.yml' --include='*.yaml' --include='*.xml' --include='*.svg' 'AI' .; then
            echo 'AI reference still exists in a text file'
            exit 1
          fi
      - name: Commit scrubbed files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'chore: remove AI references from project files'
          git push
      - name: Remove one-shot workflow
        if: success()
        run: |
          rm -f .github/workflows/scrub-ai.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'chore: remove temporary scrub workflow'
          git push
