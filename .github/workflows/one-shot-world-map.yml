name: One-shot world map redesign

on:
  push:
    paths:
      - '.github/workflows/one-shot-world-map.yml'

permissions:
  contents: write

jobs:
  redesign:
    if: github.event.head_commit.message != 'Redesign Я-Зарядка world map'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace world block
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          css = r'''
          .world-map{position:relative;background:linear-gradient(180deg,#b9efff 0%,#e9fbff 42%,#dff5dc 100%);overflow:hidden;padding-bottom:115px}
          .world-map:before{content:"";position:absolute;left:7%;top:55px;width:180px;height:65px;border-radius:999px;background:rgba(255,255,255,.78);box-shadow:70px 12px 0 -8px rgba(255,255,255,.72);filter:blur(1px)}
          .world-map:after{content:"";position:absolute;right:7%;top:115px;width:150px;height:55px;border-radius:999px;background:rgba(255,255,255,.62);box-shadow:-55px 10px 0 -7px rgba(255,255,255,.68)}
          .map-head{text-align:center;position:relative;z-index:3;margin-bottom:35px}.map-head h2{font-size:clamp(38px,5vw,60px);line-height:1.02;margin:0 0 12px}.map-head p{max-width:650px;margin:auto;color:#527066;font-size:17px}
          .map-path{position:relative;z-index:3;display:grid;grid-template-columns:repeat(4,1fr);gap:16px;align-items:stretch}.map-path:before{content:"";position:absolute;left:12%;right:12%;top:50%;height:12px;background:#fff;border-radius:99px;box-shadow:0 5px 0 rgba(39,182,107,.12);z-index:-1}
          .map-stop{position:relative;background:#fff;border:7px solid #fff;border-radius:34px;min-height:285px;padding:22px 20px 20px;box-shadow:0 20px 45px rgba(31,105,73,.15);display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;transition:.25s}.map-stop:hover{transform:translateY(-8px) rotate(-1deg)}
          .map-stop:nth-child(2){transform:translateY(22px) rotate(1deg)}.map-stop:nth-child(2):hover{transform:translateY(14px) rotate(1deg)}.map-stop:nth-child(3){transform:translateY(-5px) rotate(-1deg)}
          .map-scene{position:absolute;inset:0 0 auto;height:165px;background:linear-gradient(180deg,#bcefff,#e7faff 62%,#82ce67 63%,#5ab85e 100%)}.map-scene:after{content:"🌼 🌸 🌷 🌼 🌻";position:absolute;bottom:4px;left:10px;font-size:22px;letter-spacing:3px}.map-stop:nth-child(1) .map-scene:before{content:"🛝  🪁  ⚽";position:absolute;left:18px;bottom:40px;font-size:43px}.map-stop:nth-child(2) .map-scene:before{content:"🤸  ⭐  ⚡";position:absolute;left:17px;bottom:38px;font-size:39px}.map-stop:nth-child(3) .map-scene:before{content:"🎨  🖍️  🌈";position:absolute;left:15px;bottom:39px;font-size:38px}.map-stop:nth-child(4) .map-scene:before{content:"🏆  ⭐  🎉";position:absolute;left:17px;bottom:39px;font-size:39px}.map-stop:nth-child(4) .map-scene{background:linear-gradient(180deg,#c8f2ff,#f4fbff 62%,#7dca66 63%,#52b65a 100%)}
          .map-number{position:absolute;z-index:4;top:13px;left:13px;width:38px;height:38px;border-radius:14px;background:#fff;display:grid;place-items:center;font-weight:1000;color:var(--deep);box-shadow:0 7px 15px rgba(31,105,73,.12)}.map-stop h3{position:relative;z-index:2;margin:0 0 6px;font-size:23px}.map-stop p{position:relative;z-index:2;margin:0;color:#668076;font-size:14px}.map-go{position:relative;z-index:2;align-self:flex-start;margin-top:14px;padding:9px 14px;border-radius:12px;background:var(--green);color:#fff;font-weight:900;font-size:13px}.map-sparkles{position:absolute;z-index:4;right:15px;top:12px;font-size:23px}
          .map-bottom{position:absolute;left:0;right:0;bottom:0;height:92px;background:linear-gradient(#65c96b,#45ae5b);border-radius:50% 50% 0 0/75% 75% 0 0}.map-bottom:after{content:"🌼  🌸  🌷  🌻  🌼  🌸  🌷  🌼  🌻";position:absolute;left:6%;bottom:18px;font-size:24px;letter-spacing:8px;white-space:nowrap}
          @media(max-width:900px){.map-path{grid-template-columns:1fr 1fr}.map-path:before{left:25%;right:25%;top:25%;bottom:25%;width:12px;height:auto}.map-stop:nth-child(2),.map-stop:nth-child(3){transform:none}.map-stop:nth-child(2):hover,.map-stop:nth-child(3):hover{transform:translateY(-8px)}}
          @media(max-width:560px){.world-map{padding-bottom:80px}.map-head h2{font-size:35px}.map-head p{font-size:15px}.map-path{grid-template-columns:1fr;gap:14px}.map-path:before{display:none}.map-stop,.map-stop:nth-child(2),.map-stop:nth-child(3){min-height:255px;transform:none}.map-scene{height:145px}.map-stop h3{font-size:21px}.map-bottom{height:65px}.map-bottom:after{font-size:17px;letter-spacing:4px}}
          '''

          if '.world-map{' not in s:
              s = s.replace('</style>', css + '\n</style>', 1)

          new_block = r'''<section id="world" class="world-map">
          <div class="container">
            <div class="map-head reveal">
              <h2>Карта мира «Я-Зарядки»</h2>
              <p>Выбирай, куда отправиться сегодня. Здесь каждое занятие — маленькое приключение.</p>
            </div>
            <div class="map-path">
              <article class="map-stop reveal"><div class="map-scene"></div><span class="map-number">1</span><span class="map-sparkles">☀️</span><h3>🏞️ Площадка</h3><p>Прыгай, играй и исследуй мир вместе с друзьями.</p><span class="map-go">Идём играть →</span></article>
              <article class="map-stop reveal"><div class="map-scene"></div><span class="map-number">2</span><span class="map-sparkles">⚡</span><h3>🏃 Зарядка</h3><p>Весёлые движения превращаются в энергию и новые победы.</p><span class="map-go">Начать зарядку →</span></article>
              <article class="map-stop reveal"><div class="map-scene"></div><span class="map-number">3</span><span class="map-sparkles">🎨</span><h3>🎨 Творчество</h3><p>Рисуй, придумывай героев и добавляй свои идеи в наш мир.</p><span class="map-go">Творить →</span></article>
              <article class="map-stop reveal"><div class="map-scene"></div><span class="map-number">4</span><span class="map-sparkles">🏆</span><h3>🏆 Достижения</h3><p>Собирай звёзды, открывай награды и двигайся дальше.</p><span class="map-go">Мои победы →</span></article>
            </div>
          </div>
          <div class="map-bottom"></div>
          </section>'''

          s, n = re.subn(r'<section id="world" class="world">.*?</section>', new_block, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('World section not found; refusing to modify file')
          s = s.replace('<a href="#world">Наш мир</a>', '<a href="#world">Карта мира</a>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/one-shot-world-map.yml
          git rm .github/workflows/one-shot-world-map.yml
          git commit -m "Redesign Я-Зарядка world map"
          git push
