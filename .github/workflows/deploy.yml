name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Validate HTML
        run: |
          echo "Validating HTML structure..."
          grep -q "<!DOCTYPE html>" index.html || exit 1
          grep -q "</html>" index.html || exit 1
          echo "✓ HTML validation passed"

      - name: Check required files
        run: |
          echo "Checking required files..."
          test -f index.html || exit 1
          test -f styles/main.css || exit 1
          test -f scripts/main.js || exit 1
          test -f manifest.webmanifest || exit 1
          test -f robots.txt || exit 1
          test -f sitemap.xml || exit 1
          echo "✓ All required files present"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
